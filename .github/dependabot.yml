# DOCBOT-1625: weekly dependency updates. Minor/patch bumps are grouped per
# ecosystem to keep PR volume manageable; security updates still open
# individually (Dependabot security updates ignore grouping limits).
# DOCBOT-1630: semver-major version updates are ignored for pip and npm.
# `ignore` only applies to version updates, so security updates (including
# majors that fix an advisory) still open. Do majors deliberately, by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "python"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "javascript"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
