name: Security

# DOCBOT-1625: static analysis, dependency audit and secret scanning.
#
# Jobs marked `continue-on-error: true` currently fail on PRE-EXISTING findings
# (baseline recorded 2026-10-25 at 1f2ade3). They report but do not block.
# Remove `continue-on-error` once each baseline is cleared:
#   npm audit — 1 critical (next), 10 high (incl. zod, sharp, postcss); fix tracked by Dependabot
# Cleared by DOCBOT-1633 (now blocking):
#   bandit    — B108/B608 findings fixed in code (no config-level skips)
#   pip-audit — langsmith bumped; chromadb advisories with no fix ignored per-ID below
# gitleaks is blocking: history is clean apart from an allowlisted test canary.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC — catches newly published advisories

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (api/, medium+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install "bandit==1.9.4"
      - name: Run bandit
        run: bandit -r api -ll

  pip-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      # DOCBOT-1633: chromadb 1.5.9 is the latest release and no fixed version
      # exists for the advisories below. Every one targets Chroma's HTTP server
      # (FastAPI /api/v2 routes) or its server-side auth providers. DocBot never
      # runs that server: api/utils/vector_store.py embeds Chroma in-process via
      # langchain_chroma / chromadb.PersistentClient, the container only exposes
      # uvicorn api.index:app, and collection configs are never user-supplied
      # (no trust_remote_code embedding functions). Ignored per ID, never
      # wholesale. Revisit 2026-12-01 or as soon as a fixed chromadb ships.
      - name: Run pip-audit
        run: |
          ignores=(
            # CVE-2026-45829 / GHSA-f4j7-r4q5-qw2c: pre-auth RCE via
            # trust_remote_code on the server's create-collection endpoint.
            # Not reachable: no Chroma HTTP server. Revisit 2026-12-01.
            --ignore-vuln PYSEC-2026-311
            # CVE-2026-45830 / GHSA-2wm9-hf6c-p5cr: server lacks per-tenant
            # authz on collection CRUD. Not reachable: no Chroma server or
            # Chroma tenants; DocBot scopes collections per session itself.
            # Revisit 2026-12-01.
            --ignore-vuln PYSEC-2026-3813
            # CVE-2026-45833 / GHSA-36p7-vc44-83pf: authenticated RCE via
            # trust_remote_code on the server's update-collection endpoint.
            # Not reachable: no Chroma HTTP server. Revisit 2026-12-01.
            --ignore-vuln PYSEC-2026-3814
            # CVE-2026-45831 / GHSA-xph7-9rjv-w5fr: SimpleRBACAuthorizationProvider
            # ignores tenant scope. Not reachable: that server auth provider is
            # never configured. Revisit 2026-12-01.
            --ignore-vuln PYSEC-2026-3815
          )
          pip-audit -r requirements.txt --progress-spinner off "${ignores[@]}"

  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    continue-on-error: true  # baseline: 1 critical + 10 high, see header
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run npm audit
        run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan every commit, not just the tip
      # CLI binary instead of gitleaks-action: the action needs a paid license
      # for organization-owned repos; the CLI is MIT and needs no secrets.
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --config .github/gitleaks.toml --redact --no-banner --verbose
