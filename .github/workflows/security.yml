name: Security

# DOCBOT-1625: static analysis, dependency audit and secret scanning.
#
# Jobs marked `continue-on-error: true` currently fail on PRE-EXISTING findings
# (baseline recorded 2026-10-25 at 1f2ade3). They report but do not block.
# Remove `continue-on-error` once each baseline is cleared:
#   bandit    — 6 MEDIUM (5x B108 hardcoded /tmp, 1x B608 SQL string) / 0 HIGH
#   pip-audit — langsmith 0.7.17 (5 advisories, fix >=0.8.18), chromadb 1.5.9 (5 advisories)
#   npm audit — 1 critical (next), 10 high (incl. zod, sharp, postcss); fix tracked by Dependabot
# gitleaks is blocking: history is clean apart from an allowlisted test canary.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC — catches newly published advisories

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (api/, medium+)
    runs-on: ubuntu-latest
    continue-on-error: true  # baseline: 6 MEDIUM findings, see header
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install "bandit==1.9.4"
      - name: Run bandit
        run: bandit -r api -ll

  pip-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    continue-on-error: true  # baseline: langsmith + chromadb advisories, see header
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off

  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    continue-on-error: true  # baseline: 1 critical + 10 high, see header
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run npm audit
        run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan every commit, not just the tip
      # CLI binary instead of gitleaks-action: the action needs a paid license
      # for organization-owned repos; the CLI is MIT and needs no secrets.
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --config .github/gitleaks.toml --redact --no-banner --verbose
